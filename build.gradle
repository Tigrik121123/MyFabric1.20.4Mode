plugins {
    // id 'fabric-loom' version '1.6.11' // Вызывало ошибку с Problems API
    id 'fabric-loom' version '1.10-SNAPSHOT' // Возвращаемся к этой версии
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group

base {
	archivesName = project.archives_base_name
}

// --- ДОБАВЛЕН ЯВНЫЙ БЛОК РЕПОЗИТОРИЕВ ---
repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
}
// -----------------------------------------

loom {
	splitEnvironmentSourceSets()

	mods {
		// Имя "modid" здесь должно совпадать с твоим mod_id из gradle.properties, если ты хочешь специфичные настройки для мода
		// Или можно оставить "modid" как плейсхолдер, если общие настройки sourceSet подходят
		// Правильнее будет так:
		"${project.mod_id}" { // Используем ${project.mod_id}
			sourceSet sourceSets.main
			// sourceSet sourceSets.client // Раскомментируй, если у тебя есть код только для клиента
		}
	}
    // Добавим это на всякий случай, если Loom кэширует что-то не то
    // runConfigs.configureEach {
    //     it.refreshDeps()
    // }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Используем Fabric API BOM
    modImplementation platform("net.fabricmc:fabric-api-bom:${project.fabric_version}")

    // Подключаем необходимые модули Fabric API по отдельности
    modImplementation "net.fabricmc.fabric-api:fabric-api-base"
    modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1"
    modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2"
    modImplementation "net.fabricmc.fabric-api:fabric-message-api-v1"
    modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1"
    modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1"
    modImplementation "net.fabricmc.fabric-api:fabric-advancement-api-v1" // Оставляем это имя, так как оно наиболее вероятно для BOM
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_group", project.mod_group
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version

    filesMatching("fabric.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
    // inputs.property "archivesName", project.base.archivesName.get() // Используем .get() для Property
	from("LICENSE") {
        // rename { "${it}_${project.base.archivesName.get()}"} // Используем .get()
        // Если у тебя нет файла LICENSE, эту секцию from("LICENSE") можно закомментировать или удалить
        // Чтобы избежать ошибки, если файла нет:
        onlyIf { project.file("LICENSE").exists() }
        rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
            // artifactId = project.archives_base_name // Это было из gradle.properties
            // Правильнее использовать значение из base.archivesName, которое уже установлено
            artifactId = project.base.archivesName.get() // Используем .get()
			from components.java
		}
	}
	repositories {
		// Репозитории для публикации (если будешь публиковать)
	}
}
